[project]
name = "penr"
version = "0.1.0"
description = "penr — AI autonomous pentest platform (CrewAI + LangGraph; AntiFox-inspired)"
readme = "README.md"
authors = [
    { name = "loyd", email = "42228949+zol9527@users.noreply.github.com" }
]
requires-python = ">=3.13,<3.14"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "langgraph>=0.4.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "crewai>=0.100.0",
    "python-docx>=1.1.0",
    "httpx>=0.28.0",
    "pyjwt>=2.10.0",
    "pydantic-settings>=2.6.0",
    "bcrypt>=4.0.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.17",
    "sse-starlette>=2.1.0",
    "aiosqlite>=0.20.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
    "openviking-sdk>=0.1.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
penr = "penr.cli:main"
# 兼容旧 CLI 名
agents = "penr.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
